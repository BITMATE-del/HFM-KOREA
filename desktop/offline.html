<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VELTRO HTS | 연결 확인</title>
<style>
:root{font-family:"Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif;color:#193354;background:#edf2f9}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
.panel{width:min(420px,100%);padding:35px 32px;background:white;border:1px solid #dbe4f0;border-radius:14px;box-shadow:0 12px 38px #14345712;text-align:center}
.brand{font-size:23px;font-weight:900;letter-spacing:-.5px;color:#214d9a}.line{height:3px;width:35px;background:#245fba;margin:15px auto 25px;border-radius:5px}
h1{font-size:18px;margin:0 0 12px}p{font-size:13px;color:#6c7e98;line-height:1.8;margin:0 0 23px}
button{border:0;background:#275fc0;color:#fff;border-radius:8px;font-size:13px;font-weight:750;height:45px;width:100%;cursor:pointer}button:hover{background:#1f50a7}
</style></head>
<body><main class="panel"><div class="brand">VELTRO HTS</div><div class="line"></div>
<h1>거래 서버에 연결할 수 없습니다</h1><p>인터넷 연결 상태를 확인하고 다시 연결해 주세요.</p>
<button id="reconnect" type="button">다시 연결</button></main>
<script>document.getElementById("reconnect").addEventListener("click",function(){location.assign("https://hfm-futures-web-production.up.railway.app/")});</script>
</body></html>
