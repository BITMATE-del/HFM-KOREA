<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self';style-src 'self' 'unsafe-inline';connect-src 'none';img-src 'self' data:;object-src 'none'">
<title>HFM KOREA HTS · 독립 패널</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;font-family:"Malgun Gothic",Arial,sans-serif;background:#edf2f8;color:#203a54}
header{height:46px;display:flex;align-items:center;gap:10px;padding:0 13px;background:#102a44;color:#edf7ff}
.brand{font-weight:850;font-size:12px;white-space:nowrap}
#kindLabel{font-size:12px;color:#9bb5cd}
.controls{display:flex;align-items:center;gap:8px;margin-left:auto}
button,select{background:#1b466c;color:#f0f7ff;border:1px solid #457094;padding:6px 9px;border-radius:5px;font-size:11px}
button{cursor:pointer}button:hover{background:#29628f}
#symbol{width:83px}#linked{display:flex;gap:5px;align-items:center;font-size:11px;white-space:nowrap;cursor:pointer}
#linked input{accent-color:#42a2ea}
#shellNote{position:absolute;top:58px;left:12px;font-size:11px;color:#7890a5;pointer-events:none}
#panelSlot{position:absolute;top:46px;bottom:0;left:0;right:0;background:#fff}
@media(max-width:560px){header{gap:4px;padding:0 6px}.brand{display:none}.controls{gap:4px}#symbol{width:72px}button,select{padding:6px 5px}#linked{font-size:10px;gap:2px}}
</style></head><body>
<header><span class="brand">HFM KOREA</span><span id="kindLabel">차트</span>
<div class="controls"><select id="symbol" aria-label="종목">
<option value="NQ">NQ · 나스닥</option><option value="MNQ">MNQ · 마이크로 나스닥</option>
<option value="ES">ES · S&amp;P500</option><option value="MES">MES · 마이크로 S&amp;P</option>
<option value="GC">GC · 금</option><option value="MGC">MGC · 마이크로 금</option>
<option value="CL">CL · 원유</option><option value="MCL">MCL · 마이크로 원유</option>
</select><label id="linked"><input type="checkbox" checked>메인 종목 연동</label>
<button id="main" type="button">메인창</button><button id="refresh" type="button">새로고침</button>
</div></header><div id="panelSlot"></div><span id="shellNote">거래 서버 연결 중입니다.</span>
<script src="./detached.js"></script></body></html>
