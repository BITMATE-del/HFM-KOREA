<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HFM KOREA | 해외선물 관리자</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f8;color:#1b3156;font-family:"Malgun Gothic",Arial,sans-serif}header{background:white;padding:15px 25px;min-height:70px;border-bottom:1px solid #dae1ee;display:flex;justify-content:space-between;align-items:center}b{color:#214c9b}small{color:#7b879c}main{max-width:1200px;padding:24px;margin:auto}h1{font-size:24px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}button{border:1px solid #cfdaec;background:white;color:#234777;border-radius:6px;padding:11px 16px;cursor:pointer}button.active{background:#153c7b;color:white;border-color:#153c7b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:white;border:1px solid #dde4f0;border-radius:7px;padding:19px;margin-bottom:12px}.stat{font-size:25px;font-weight:700;margin-top:9px}table{width:100%;border-collapse:collapse;background:white}th,td{padding:12px;border-bottom:1px solid #e7edf7;text-align:left;font-size:13px}th{background:#f8faff}.scroll{overflow:auto}p{line-height:1.7;color:#697b99}.tag{background:#e9f0ff;color:#2459bb;padding:5px 8px;border-radius:5px;font-size:11px}a{color:#2859b8;text-decoration:none}@media(max-width:650px){main{padding:12px}header{padding:14px}}</style></head><body><header><div><img src="/assets/hfm-korea-logo.svg" alt="HFM KOREA" width="184" style="width:184px;height:auto;vertical-align:middle"><small style="display:inline-block;margin-left:16px;border-left:1px solid #dce4ef;padding-left:15px;vertical-align:middle;font-size:11px;letter-spacing:.5px">FUTURES · 관리자</small></div><a href="/">거래 화면으로</a></header><main><h1>운영 관리</h1><p>이 화면은 브라우저의 데모 거래 기록만 조회합니다. 실제 회원 데이터·자산·입출금 승인은 연결되어 있지 않습니다.</p><nav id="tabs"><button data-p="summary" class="active">운영 현황</button><button data-p="orders">주문·체결</button><button data-p="positions">보유 포지션</button><button data-p="transactions">입출금 내역</button><button data-p="security">환경·보안</button></nav><div id="content"></div></main><script>(()=>{const key='hfm_futures_offline_demo_v1',el=document.getElementById('content');let page='summary';const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=x=>Number(x||0).toLocaleString('ko-KR');const data=()=>{try{return JSON.parse(localStorage.getItem(key)||'null')||{}}catch{return {}}};const tbl=(cols,rows)=>'<div class="card scroll"><table><thead><tr>'+cols.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+(rows.length?rows.map(row=>'<tr>'+row.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+cols.length+'">데모 기록이 없습니다.</td></tr>')+'</tbody></table></div>';function render(){const d=data(),orders=d.orders||[],positions=d.positions||[],tx=d.transactions||[];let html='';if(page==='summary'){html='<div class="grid">'+[['데모 주문',orders.length],['보유 포지션',positions.length],['데모 거래 기록',tx.length],['해외선물 가용 현금',fmt(d.cash)+' 원']].map(x=>'<div class="card">'+x[0]+'<div class="stat">'+x[1]+'</div></div>').join('')+'</div><div class="card"><b>안내</b><p>이 페이지는 운영 관리자 화면이 아닙니다. 실제 회원관리와 주문 승인 기능은 별도 서버 연결 및 권한 검증 후 구현해야 합니다.</p></div>';}else if(page==='orders')html=tbl(['주문번호','종목','방향','수량','상태'],orders.slice(-100).reverse().map(x=>[x.id,x.symbol||x.name,x.side,x.qty||x.quantity,x.status]));else if(page==='positions')html=tbl(['종목','방향','수량','진입가'],positions.map(x=>[x.symbol||x.name,x.side,x.qty||x.quantity,fmt(x.entryPrice||x.entry)]));else if(page==='transactions')html=tbl(['시간','유형','금액','상태'],tx.slice(-100).reverse().map(x=>[x.time||x.date,x.type,fmt(x.amount),x.status]));else html='<div class="card"><b>독립 운영 환경 점검</b><p>전용 Supabase 프로젝트, 서버 API, 관리자 인증, RLS, 출금 승인·잔고 원장이 연결되기 전까지 실제 금융 서비스 배포 및 사용을 금지합니다.</p><p><span class="tag">DEMO ONLY</span></p></div>';el.innerHTML=html;document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===page))}document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button[data-p]');if(!b)return;page=b.dataset.p;render()};render()})()</script></body></html>
