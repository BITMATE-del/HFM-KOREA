<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HFM KOREA | 해외선물 관리자 데모</title><style>:root{font-family:Arial,"Malgun Gothic",sans-serif;color:#1a2e4b}*{box-sizing:border-box}body{margin:0;background:#f2f5fa}header{height:62px;background:white;border-bottom:1px solid #dce4ee;display:flex;align-items:center;justify-content:space-between;padding:0 20px}header b{font-size:20px;color:#183b70}header small{display:block;font-size:10px;letter-spacing:2px;color:#8191aa}a{color:#2459bb;text-decoration:none;font-size:12px}.info{background:#fff7e7;color:#906b20;font-size:12px;padding:11px 20px}.shell{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:calc(100vh - 100px)}nav{padding:15px;background:#fff;border-right:1px solid #dce4ee}nav button{display:block;text-align:left;width:100%;padding:14px;margin:3px 0;border:0;background:transparent;border-radius:6px;color:#526785}nav button.active{background:#eaf2ff;color:#2459bb;font-weight:700}main{padding:18px;min-width:0}h1{font-size:20px;margin:6px 0 18px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid #dce4ee;border-radius:10px;padding:18px}.card small{color:#788da7}.card strong{display:block;font-size:23px;margin-top:10px}.panel{margin-top:12px;overflow:auto}.warn{background:#fff8eb;border:1px solid #efdcb8;color:#92702e;border-radius:6px;padding:15px;line-height:1.7;font-size:12px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:12px 10px;text-align:left;border-bottom:1px solid #edf1f7;font-size:12px}th{background:#f7f9fc;color:#667d9a}button{cursor:pointer}.entry{max-width:510px;margin:9vh auto;background:#fff;padding:33px;border:1px solid #dce4ee;border-radius:12px}.primary{border:0;border-radius:6px;padding:13px 18px;background:#2459bb;color:white;font-weight:700}.hide{display:none!important}@media(max-width:850px){.shell{grid-template-columns:1fr}nav{display:flex;overflow:auto;padding:5px}nav button{width:auto;white-space:nowrap}.cards{grid-template-columns:1fr 1fr}}</style></head><body><header><div><b>HFM KOREA</b><small>FUTURES ADMIN · DEMO</small></div><a href="./index.html">거래 화면으로 이동</a></header><div class="info">DEMO ONLY · 실제 회원·거래 내역 및 서버 계정은 조회하거나 변경하지 않습니다.</div><div id="entry" class="entry"><h2>관리자 화면 미리보기</h2><p style="font-size:13px;color:#627893;line-height:1.8">이 화면은 실제 관리자 로그인이나 인증이 아니며, 현재 브라우저의 데모 주문·입출금 내역만 조회합니다. 운영 배포 전에는 별도 인증과 권한 관리가 필수입니다.</p><button id="enter" class="primary">데모 관리자 화면 보기</button></div><div id="app" class="shell hide"><nav><button data-page="overview" class="active">운영 현황</button><button data-page="users">회원 현황</button><button data-page="orders">주문·체결</button><button data-page="wallet">입출금 기록</button><button data-page="positions">보유 포지션</button><button data-page="settings">환경·보안</button></nav><main id="content"></main></div><script>(function(){const key='hfm_futures_offline_demo_v1';let current='overview';const $=s=>document.querySelector(s),es=s=>[...document.querySelectorAll(s)],n=x=>Number(x||0).toLocaleString('ko-KR'),date=x=>new Date(x).toLocaleString('ko-KR',{hour12:false}),escape=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const get=()=>{try{return JSON.parse(localStorage.getItem(key)||'null')||{cash:50000000,stockCash:10000000,orders:[],positions:[],transactions:[]}}catch{return {cash:0,stockCash:0,orders:[],positions:[],transactions:[]}}};const table=(heads,rows)=>'<div class="panel"><table><thead><tr>'+heads.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+(rows.length?rows.join(''):'<tr><td colspan="'+heads.length+'" style="text-align:center;padding:28px;color:#8b9cb1">데모 내역이 없습니다.</td></tr>')+'</tbody></table></div>';function render(){const d=get(),orders=d.orders||[],pos=d.positions||[],tr=d.transactions||[];es('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===current));let h='<h1>'+({overview:'운영 현황',users:'회원 현황',orders:'주문·체결 현황',wallet:'입출금 기록',positions:'보유 포지션',settings:'환경·보안'}[current])+'</h1>';if(current==='overview')h+='<div class="cards">'+[['데모 계정','1'],['전체 주문',n(orders.length)],['보유 포지션',n(pos.length)],['입출금·이동',n(tr.filter(x=>['deposit','withdraw','transfer'].includes(x.type)).length)]].map(([a,b])=>'<div class="card"><small>'+a+'</small><strong>'+b+'</strong></div>').join('')+'</div><div class="panel"><div class="warn">실제 관리자 DB, 주문·체결 서버, 잔액·승인 기능은 연결하지 않았습니다. 모든 값은 로컬 데모에 한정됩니다.</div></div>';if(current==='users')h+=table(['이용 계정','계정 유형','해외선물 잔고','주식 예수금'],['<tr><td>데모 사용자</td><td>시연</td><td>'+n(d.cash)+'원</td><td>'+n(d.stockCash)+'원</td></tr>']);if(current==='orders')h+=table(['시간','종목','매매구분','수량','주문 상태'],orders.slice().reverse().map(o=>'<tr><td>'+date(o.at)+'</td><td>'+escape(o.symbol)+'</td><td>'+escape(o.side)+'</td><td>'+n(o.qty)+'</td><td>'+escape(o.status)+'</td></tr>'));if(current==='wallet')h+=table(['시간','유형','대상','금액'],tr.filter(x=>['deposit','withdraw','transfer'].includes(x.type)).slice().reverse().map(o=>'<tr><td>'+date(o.at)+'</td><td>'+escape(o.type)+'</td><td>'+escape(o.wallet)+'</td><td>'+n(o.amount)+'원</td></tr>'));if(current==='positions')h+=table(['종목','방향','수량','진입가'],pos.map(o=>'<tr><td>'+escape(o.symbol)+'</td><td>'+escape(o.side)+'</td><td>'+n(o.qty)+'</td><td>'+n(o.entry)+'</td></tr>'));if(current==='settings')h+='<div class="panel"><div class="warn">운영 서비스에 필요한 관리자 로그인·2FA, 권한 분리, 감사로그, RLS, 출금 승인, 잔고·원장 정합성 및 거래 멱등 처리 검증이 아직 필요합니다.</div></div>';$('#content').innerHTML=h;}$('#enter').onclick=()=>{$('#entry').classList.add('hide');$('#app').classList.remove('hide');render()};es('[data-page]').forEach(b=>b.onclick=()=>{current=b.dataset.page;render()});})();</script></body></html>
