<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HFM KOREA FUTURES | 관리자</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0f3f8;color:#1b3559;font:13px "Malgun Gothic",sans-serif}header{height:70px;background:white;border-bottom:1px solid #dce4ed;display:flex;align-items:center;justify-content:space-between;padding:0 27px;gap:12px}header img{width:182px}header a{color:#456aab;text-decoration:none;font-size:12px}main{max-width:1270px;margin:0 auto;padding:27px 22px}h1{font-size:22px;margin:0 0 8px;letter-spacing:-.6px}h2{font-size:16px;margin:0 0 16px}p{color:#7c8da4}nav{display:flex;gap:7px;border-bottom:1px solid #dbe4ef;margin:24px 0 17px;flex-wrap:wrap}nav button{border:0;background:none;border-bottom:3px solid transparent;border-radius:0;padding:13px 17px;font-size:13px}nav button.active{color:#2258b9;border-color:#d9293a;font-weight:800}button{cursor:pointer;padding:9px 14px;background:#fff;border:1px solid #d4e0ef;border-radius:5px;color:#284979;font:inherit}button.primary{background:#2557b7;color:white;border-color:#2557b7}button.danger{color:#d02c3f}button:hover{filter:brightness(.97)}.card{background:#fff;border:1px solid #dbe3ee;border-radius:8px;padding:19px;margin-bottom:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.metric{font-weight:850;font-size:26px;margin-top:10px}.label{font-size:11px;color:#71849c}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px;align-items:center}input,textarea{padding:11px;border:1px solid #d7e0eb;background:#f8faff;color:#1b3559;border-radius:5px;font:inherit}input:focus,textarea:focus{outline:2px solid #d5e3fc}input[type=search]{min-width:230px}textarea{width:100%;min-height:120px;resize:vertical}table{width:100%;border-collapse:collapse}th,td{padding:13px 10px;text-align:left;border-bottom:1px solid #edf1f6;vertical-align:middle}th{background:#f7f9fc;color:#7688a3;font-size:11px}td{font-size:12px}.scroll{overflow:auto}.pill{font-size:10px;font-weight:750;border-radius:4px;padding:5px 8px;background:#e8eefb;color:#2155af}.pill.frozen{color:#c52e43;background:#fbedef}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.stack{display:grid;gap:12px}.form{max-width:540px}.form input{width:100%}.muted{color:#8798ad;font-size:12px}.error{color:#cd2d41;font-size:12px}.ok{color:#12836d}.line{padding:13px 0;border-bottom:1px solid #e9eef4}label{display:block;color:#56708e;font-size:12px;font-weight:700}label input,label textarea{margin-top:7px}.notice-form{display:grid;gap:12px}#app{min-height:400px}#notice-editor{max-width:820px}.hidden{display:none!important}@media(max-width:640px){main{padding:17px 11px}header{padding:0 13px}header img{width:145px}td,th{padding:9px 6px}nav button{padding:11px 9px}}
</style></head><body><header><div class="row"><img src="/assets/hfm-korea-logo.svg" alt="HFM KOREA"><span class="muted">해외선물 운영관리</span></div><a href="/">거래 화면</a></header>
<main><h1>운영 관리</h1><p>회원 · 공지 · 상담 관리</p><div id="auth-box" class="card form hidden"><h2>관리자 로그인</h2><form id="login" class="stack"><label>아이디<input name="id" autocomplete="username" required></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">로그인</button></form><p id="auth-error" class="error"></p></div><div id="shell" class="hidden"><div class="row"><span id="admin-name" class="muted"></span><button id="logout">로그아웃</button></div><nav id="tabs"><button class="active" data-tab="overview">운영 현황</button><button data-tab="members">회원 관리</button><button data-tab="notices">공지사항</button><button data-tab="support">고객 상담</button></nav><div id="app"></div></div><p id="loading">관리자 접속을 확인하고 있습니다.</p></main>
<script>
(function(){
 "use strict";
 var user=null,tab="overview",selectedThread=null,editingNotice=null,cache={};
 var $=id=>document.getElementById(id);
 var esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 var stamp=v=>v?new Date(v).toLocaleString("ko-KR"):"-";
 async function api(path,method,body){
  var r=await fetch(path,{method:method||"GET",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  var j=await r.json().catch(()=>({error:"INVALID_RESPONSE"}));
  if(!r.ok)throw Error(j.error||"SERVER_UNAVAILABLE");
  return j;
 }
 function message(t,bad){var box=$("auth-error");if(box){box.textContent=t;box.className=bad?"error":"ok"}}
 function authenticated(u){user=u;$("loading").classList.add("hidden");$("auth-box").classList.add("hidden");$("shell").classList.remove("hidden");$("admin-name").textContent=u.name+" ("+u.username+")";render()}
 function unauth(){user=null;$("loading").classList.add("hidden");$("shell").classList.add("hidden");$("auth-box").classList.remove("hidden")}
 async function boot(){try{var a=await api("/api/auth/me");if(a.authenticated&&a.user.role==="ADMIN")authenticated(a.user);else unauth()}catch(e){unauth();message("서버 연결 확인 실패: "+e.message,true)}}
 $("login").onsubmit=async e=>{e.preventDefault();var f=e.target;try{var r=await api("/api/auth/login","POST",{id:f.elements.id.value,password:f.elements.password.value});f.elements.password.value="";if(r.user.role!=="ADMIN"){await api("/api/auth/logout","POST",{});throw Error("ADMIN_REQUIRED")}authenticated(r.user)}catch(err){message(err.message,true)}};
 $("logout").onclick=async()=>{await api("/api/auth/logout","POST",{}).catch(()=>{});unauth()};
 $("tabs").onclick=e=>{var b=e.target.closest("[data-tab]");if(!b)return;tab=b.dataset.tab;selectedThread=null;editingNotice=null;document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));render()};
 async function render(){
  var root=$("app");root.innerHTML='<div class="card muted">조회 중...</div>';
  try{
   if(tab==="overview"){var r=await api("/api/admin/overview");root.innerHTML='<div class="grid">'+[["전체 회원",r.members],["활성 회원",r.active],["공지사항",r.notices],["상담 메시지",r.messages]].map(x=>'<section class="card"><div class="label">'+x[0]+'</div><div class="metric">'+Number(x[1]||0).toLocaleString()+'</div></section>').join("")+'</div><div class="card"><h2>관리 항목</h2><p>회원 동결, 공지 게시·수정, 상담 회신 내역은 서버 데이터베이스에 저장됩니다.</p></div>'}
   if(tab==="members")await members();
   if(tab==="notices")await notices();
   if(tab==="support")await support();
  }catch(e){root.innerHTML='<div class="card error">조회 실패: '+esc(e.message)+'</div>'}
 }
 async function members(q=""){
  var r=await api("/api/admin/members?q="+encodeURIComponent(q));
  $("app").innerHTML='<div class="card"><div class="toolbar"><input id="member-search" type="search" value="'+esc(q)+'" placeholder="아이디 또는 이름 검색"><button id="member-find" class="primary">조회</button></div><div class="scroll"><table><thead><tr><th>아이디</th><th>이름</th><th>연락처</th><th>담당코드</th><th>가입일</th><th>상태</th><th>관리</th></tr></thead><tbody>'+r.items.map(x=>'<tr><td>'+esc(x.username)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.phone)+'</td><td>'+esc(x.referral)+'</td><td>'+stamp(x.createdAt)+'</td><td><span class="pill '+(x.status==="FROZEN"?"frozen":"")+'">'+(x.status==="FROZEN"?"동결":"정상")+'</span></td><td>'+(x.role==="ADMIN"?"관리자":'<button data-status="'+(x.status==="FROZEN"?"ACTIVE":"FROZEN")+'" data-id="'+x.id+'">'+(x.status==="FROZEN"?"해제":"동결")+'</button>')+'</td></tr>').join("")+'</tbody></table></div></div>';
  $("member-find").onclick=()=>members($("member-search").value);
  $("member-search").onkeydown=e=>{if(e.key==="Enter")members(e.target.value)};
  $("app").onclick=async e=>{var b=e.target.closest("[data-status]");if(!b)return;if(!confirm(b.dataset.status==="FROZEN"?"회원을 동결할까요?":"회원 동결을 해제할까요?"))return;try{await api("/api/admin/members/"+b.dataset.id+"/status","POST",{status:b.dataset.status});members($("member-search").value)}catch(x){alert(x.message)}};
 }
 async function notices(){
  var r=await api("/api/admin/notices");cache.notices=r.items;
  var obj=editingNotice?cache.notices.find(x=>x.id===editingNotice):null;
  $("app").innerHTML='<section class="card" id="notice-editor"><h2>'+(obj?"공지 수정":"공지 작성")+'</h2><form id="notice-form" class="notice-form"><label>제목<input name="title" maxlength="160" required style="width:100%" value="'+esc(obj?.title||"")+'"></label><label>내용<textarea name="body" maxlength="10000" required>'+esc(obj?.body||"")+'</textarea></label><div class="row"><label><input name="pinned" type="checkbox" '+(obj?.pinned?"checked":"")+'> 상단 고정</label><label><input name="visible" type="checkbox" '+(obj?.visible!==false?"checked":"")+'> 공개</label></div><div class="row"><button class="primary" type="submit">'+(obj?"수정 저장":"공지 등록")+'</button>'+(obj?'<button type="button" id="notice-new">신규 작성</button>':"")+'</div></form></section><section class="card"><h2>등록 공지</h2><div class="scroll"><table><thead><tr><th>제목</th><th>등록일</th><th>노출</th><th>작업</th></tr></thead><tbody>'+r.items.map(x=>'<tr><td>'+esc(x.title)+(x.pinned?" · 고정":"")+'</td><td>'+stamp(x.createdAt)+'</td><td>'+(x.visible?"공개":"비공개")+'</td><td><button data-edit="'+x.id+'">수정</button> <button class="danger" data-delete="'+x.id+'">삭제</button></td></tr>').join("")+'</tbody></table></div></section>';
  $("notice-form").onsubmit=async e=>{e.preventDefault();var f=e.target,values={title:f.elements.title.value,body:f.elements.body.value,pinned:f.elements.pinned.checked,visible:f.elements.visible.checked};try{await api(obj?"/api/admin/notices/"+obj.id:"/api/admin/notices",obj?"PATCH":"POST",values);editingNotice=null;await notices()}catch(err){alert(err.message)}};
  if($("notice-new"))$("notice-new").onclick=()=>{editingNotice=null;notices()};
  $("app").onclick=async e=>{var b=e.target.closest("[data-edit],[data-delete]");if(!b)return;if(b.dataset.edit){editingNotice=b.dataset.edit;return notices()}if(b.dataset.delete&&confirm("공지를 삭제할까요?")){try{await api("/api/admin/notices/"+b.dataset.delete,"DELETE");editingNotice=null;notices()}catch(err){alert(err.message)}}};
 }
 async function support(){
  if(!selectedThread){
   var r=await api("/api/admin/support");
   $("app").innerHTML='<div class="card"><h2>상담 회원 목록</h2><table><thead><tr><th>회원</th><th>최근 메시지</th><th>메시지 수</th><th></th></tr></thead><tbody>'+r.items.map(x=>'<tr><td>'+esc(x.username)+' · '+esc(x.name)+'</td><td>'+stamp(x.lastAt)+'</td><td>'+x.messages+'</td><td><button data-thread="'+x.userId+'">상담 보기</button></td></tr>').join("")+'</tbody></table></div>';
   $("app").onclick=e=>{var b=e.target.closest("[data-thread]");if(b){selectedThread=b.dataset.thread;support()}};
  }else{
   var r=await api("/api/admin/support/"+selectedThread);
   $("app").innerHTML='<div class="card"><div class="toolbar"><button id="support-back">목록</button><h2 style="margin:0">상담 내역</h2></div>'+r.items.map(x=>'<div class="line"><span class="pill">'+(x.sender==="ADMIN"?"관리자":"회원")+'</span> <span class="muted">'+stamp(x.created_at)+'</span><p style="white-space:pre-wrap;color:#203c61">'+esc(x.message)+'</p></div>').join("")+'<form id="support-reply" class="stack" style="margin-top:18px"><textarea name="message" required maxlength="3000" placeholder="답변을 입력하세요"></textarea><button class="primary">답변 전송</button></form></div>';
   $("support-back").onclick=()=>{selectedThread=null;support()};
   $("support-reply").onsubmit=async e=>{e.preventDefault();try{await api("/api/admin/support/"+selectedThread,"POST",{message:e.target.elements.message.value});support()}catch(err){alert(err.message)}};
  }
 }
 boot();
})();
</script></body></html>
