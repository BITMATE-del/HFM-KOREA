name: HFM KOREA HTS Versioned Release
on:
  push:
    branches: [main]
    paths:
      - "desktop/package.json"
      - ".github/workflows/desktop-hts-auto-release.yml"
permissions:
  contents: write
concurrency:
  group: hfm-hts-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate version is new
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid semver version" }
          # gh release create fails safely if the version already exists; never overwrite an existing release.
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Install and test HTS
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm install failed" }
          npm test
          if ($LASTEXITCODE -ne 0) { throw "HTS tests failed" }
      - name: Build Windows NSIS installer and portable EXE
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run dist:win
          if ($LASTEXITCODE -ne 0) { throw "Windows HTS build failed" }
          if (!(Test-Path dist/latest.yml)) { throw "Auto-update latest.yml missing" }
          $setup = @(Get-ChildItem dist -File -Filter '*Setup*.exe')
          if ($setup.Count -ne 1) { throw "Expected exactly one NSIS installer" }
          if (!(Test-Path ($setup[0].FullName + '.blockmap'))) { throw "NSIS blockmap missing" }
      - name: Publish GitHub Release and update metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          $files = @(Get-ChildItem desktop/dist -File -Filter '*.exe' | ForEach-Object { $_.FullName })
          $files += @(Get-ChildItem desktop/dist -File -Filter '*.blockmap' | ForEach-Object { $_.FullName })
          $files += (Resolve-Path desktop/dist/latest.yml).Path
          gh release create "v$env:RELEASE_VERSION" $files --target "$env:GITHUB_SHA" --title "HFM KOREA HTS v$env:RELEASE_VERSION" --notes "Windows 설치형 및 무설치형 HTS 업데이트. 기존 회원 데이터와 거래 서버는 유지됩니다." --latest
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
      - name: Archive Windows deliverables
        uses: actions/upload-artifact@v4
        with:
          name: HFM-KOREA-HTS-Release-${{ env.RELEASE_VERSION }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error
          retention-days: 30
