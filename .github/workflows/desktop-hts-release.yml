name: HFM KOREA HTS Release (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must equal desktop/package.json, e.g. 0.3.0)"
        required: true
        type: string
      notes:
        description: "Release notes in Korean"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: hfm-hts-release
  cancel-in-progress: false

jobs:
  publish-windows-installer:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check release version
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          if ($env:EXPECTED_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version" }
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($packageVersion -ne $env:EXPECTED_VERSION) { throw "Release version differs from package.json" }
      - name: Install and test
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm install failed" }
          npm test
          if ($LASTEXITCODE -ne 0) { throw "desktop tests failed" }
      - name: Build unsigned NSIS and portable EXEs
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run dist:win
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed" }
          if (!(Test-Path dist/latest.yml)) { throw "Auto-update metadata missing" }
          $installers = @(Get-ChildItem dist -File -Filter "*Setup*.exe")
          if ($installers.Count -ne 1) { throw "Expected one Setup.exe" }
          if (!(Test-Path ($installers[0].FullName + ".blockmap"))) { throw "Setup blockmap missing" }
          $manifest = Get-Content dist/latest.yml -Raw
          if ($manifest -notmatch [regex]::Escape("version: ${{ inputs.version }}")) { throw "Manifest version mismatch" }
      - name: Verify Release does not exist
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        working-directory: .
        run: |
          gh release view "v$env:VERSION" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release tag already published; never overwrite updater metadata" }
          exit 0
      - name: Publish release with matching update metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
        working-directory: .
        run: |
          $files = @(Get-ChildItem desktop/dist -Filter '*.exe' -File | ForEach-Object { $_.FullName })
          $files += @(Get-ChildItem desktop/dist -Filter '*.blockmap' -File | ForEach-Object { $_.FullName })
          $files += (Resolve-Path desktop/dist/latest.yml).Path
          gh release create "v$env:VERSION" $files --target "$env:GITHUB_SHA" --title "HFM KOREA HTS v$env:VERSION" --notes "$env:RELEASE_NOTES" --latest
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publish failed" }
      - name: Upload audited build bundle
        uses: actions/upload-artifact@v4
        with:
          name: HFM-KOREA-HTS-Release-${{ inputs.version }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error
          retention-days: 30
